name: Android Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # gradle-wrapper.jar намеренно не включён в этот репозиторий (см. docs/build-status.md —
      # он собирался в офлайн-песочнице без доступа в интернет). Этот шаг ставит Gradle напрямую
      # и регенерирует wrapper, дальше используется обычный ./gradlew.
      - name: Install Gradle and regenerate wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Regenerate gradle-wrapper.jar
        run: gradle wrapper --gradle-version 8.7

      - name: Set ANDROID_SDK_ROOT
        run: echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"

      # ubuntu-latest уже поставляется с предустановленным Android SDK (командные утилиты,
      # платформы, build-tools) — отдельный шаг android-actions/setup-android@v3 не нужен и
      # исторически подвисает на интерактивном запросе "Review licenses... (y/N)?" в CI.
      # Вместо него просто принимаем лицензии для уже существующего SDK.
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests (:calculation, :data, :app)
        run: ./gradlew test --no-daemon

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            calculation/build/reports/tests/
            data/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
